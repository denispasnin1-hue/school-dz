<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание и ДЗ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
 :root {
 --board: #1B3B36;
 --board-line: #2C4F49;
 --paper: #FBF8F1;
 --paper-ink: #1B3B36;
 --chalk: #F4EFE3;
 --marker: #E8B94B;
 --pen: #E2695B;
 --muted: #6B7D78;
 }
 * { box-sizing: border-box; }
 body {
 margin: 0;
 font-family: 'Inter', sans-serif;
 background: var(--board);
 background-image:
 repeating-linear-gradient(0deg, transparent, transparent 39px, var(--board-line) 40px);
 color: var(--chalk);
 min-height: 100vh;
 }
 .wrap { max-width: 680px; margin: 0 auto; padding: 24px 18px 80px; }

 header { margin-bottom: 20px; }
 h1 {
 font-family: 'Patrick Hand', cursive;
 font-size: 42px;
 margin: 0 0 4px;
 letter-spacing: 0.5px;
 transform: rotate(-1deg);
 }
 header p { margin: 0; color: #B9C7C2; font-size: 14px; }

 .filters {
 display: flex;
 gap: 6px;
 margin: 16px 0;
 flex-wrap: wrap;
 }
 .chip {
 background: transparent;
 border: 1px solid #3E5F59;
 color: var(--chalk);
 padding: 6px 13px;
 border-radius: 100px;
 font-size: 13px;
 cursor: pointer;
 transition: all 0.2s ease;
 }
 .chip.active { background: var(--marker); color: var(--board); border-color: var(--marker); font-weight: 600; }

 .day-card {
 background: var(--paper);
 color: var(--paper-ink);
 border-radius: 6px;
 padding: 18px 20px;
 box-shadow: 0 6px 14px rgba(0,0,0,0.28);
 margin-bottom: 20px;
 position: relative;
 }
 .day-card:nth-child(3n+1) { transform: rotate(-0.4deg); }
 .day-card:nth-child(3n+2) { transform: rotate(0.4deg); }
 .day-card:nth-child(3n) { transform: rotate(-0.2deg); }

 .day-title {
 font-family: 'Patrick Hand', cursive;
 font-size: 28px;
 margin: 0 0 14px;
 border-bottom: 2px dashed #DBD4C2;
 padding-bottom: 6px;
 color: var(--paper-ink);
 }

 .lesson-list {
 display: flex;
 flex-direction: column;
 gap: 12px;
 }

 .lesson-item {
 display: flex;
 flex-direction: column;
 gap: 4px;
 border-bottom: 1px solid #EFE9DA;
 padding-bottom: 10px;
 }
 .lesson-item:last-child {
 border-bottom: none;
 padding-bottom: 0;
 }

 .lesson-header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 font-size: 15px;
 font-weight: 600;
 color: var(--paper-ink);
 }

 .lesson-num {
 font-size: 13px;
 color: var(--muted);
 width: 24px;
 }

 .lesson-name {
 flex: 1;
 font-size: 16px;
 }

 .hw-box {
 margin-top: 4px;
 font-size: 14.5px;
 line-height: 1.4;
 background: #F3EFE6;
 padding: 8px 12px;
 border-radius: 6px;
 border-left: 3px solid var(--marker);
 position: relative;
 white-space: pre-wrap;
 }

 .hw-empty {
 font-size: 13px;
 color: var(--muted);
 font-style: italic;
 margin-top: 2px;
 }

 .hw-actions {
 display: flex;
 gap: 8px;
 margin-top: 6px;
 justify-content: flex-end;
 }

 .btn-action {
 font-family: inherit;
 font-size: 12px;
 border: none;
 padding: 4px 9px;
 border-radius: 5px;
 cursor: pointer;
 font-weight: 600;
 }
 .btn-share { background: var(--board); color: var(--chalk); }
 .btn-edit { background: #E2D9C5; color: var(--paper-ink); }
 .btn-del { background: transparent; color: var(--pen); }

 .fab {
 position: fixed;
 right: 20px;
 bottom: 24px;
 width: 56px;
 height: 56px;
 border-radius: 50%;
 background: var(--marker);
 color: var(--board);
 font-size: 28px;
 border: none;
 box-shadow: 0 6px 16px rgba(0,0,0,0.4);
 cursor: pointer;
 line-height: 1;
 font-weight: bold;
 }

 .sheet-backdrop {
 display: none;
 position: fixed; inset: 0;
 background: rgba(0,0,0,0.55);
 z-index: 10;
 align-items: flex-end;
 justify-content: center;
 }
 .sheet-backdrop.open { display: flex; }
 .sheet {
 background: var(--paper);
 color: var(--paper-ink);
 width: 100%;
 max-width: 640px;
 border-radius: 18px 18px 0 0;
 padding: 20px 20px 28px;
 max-height: 88vh;
 overflow-y: auto;
 }
 .sheet h2 {
 font-family: 'Patrick Hand', cursive;
 font-size: 26px;
 margin: 0 0 14px;
 }
 .sheet label {
 display: block;
 font-size: 12.5px;
 color: var(--muted);
 margin: 12px 0 4px;
 }
 .sheet input, .sheet select, .sheet textarea {
 width: 100%;
 border: 1px solid #DBD4C2;
 border-radius: 9px;
 padding: 10px 12px;
 font-family: inherit;
 font-size: 15px;
 background: #fff;
 color: var(--paper-ink);
 }
 .sheet textarea { min-height: 80px; resize: vertical; }
 .sheet .row { display: flex; gap: 10px; }
 .sheet .row > div { flex: 1; }
 .sheet-actions {
 display: flex;
 gap: 10px;
 margin-top: 18px;
 }
 .sheet-actions button {
 flex: 1;
 font-family: inherit;
 padding: 12px;
 border-radius: 9px;
 border: none;
 font-size: 15px;
 font-weight: 600;
 cursor: pointer;
 }
 .btn-cancel { background: #EFE9DA; color: var(--paper-ink); }
 .btn-save { background: var(--board); color: var(--chalk); }
 .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
 .toast {
 position: fixed;
 left: 50%; bottom: 90px;
 transform: translateX(-50%);
 background: var(--chalk);
 color: var(--board);
 padding: 10px 18px;
 border-radius: 100px;
 font-size: 13px;
 font-weight: 600;
 opacity: 0;
 pointer-events: none;
 transition: opacity 0.25s;
 z-index: 20;
 }
 .toast.show { opacity: 1; }
</style>
</head>
<body>
 <div class="wrap">
 <header>
 <h1>Доска расписания и ДЗ</h1>
 <p>Выбери класс · Заполняй и делись в Max</p>
 </header>

 <div class="filters" id="class-filters"></div>
 <div id="schedule-cards"></div>
 </div>

 <button class="fab" id="openAdd" title="Добавить ДЗ">+</button>

 <div class="sheet-backdrop" id="backdrop">
 <div class="sheet">
 <h2>Задать ДЗ</h2>
 <label>Пароль учителя</label>
 <input type="password" id="f-pass" placeholder="если первая запись — придумай пароль">
 <div class="row">
 <div>
 <label>Класс</label>
 <select id="f-class" onchange="updateSubjectOptions()"></select>
 </div>
 <div>
 <label>День недели</label>
 <select id="f-day" onchange="updateSubjectOptions()"></select>
 </div>
 </div>
 <label>Предмет</label>
 <select id="f-subject"></select>
 <label>Задание</label>
 <textarea id="f-text" placeholder="Что задали..."></textarea>
 <div class="hint" id="pass-hint"></div>
 <div class="sheet-actions">
 <button class="btn-cancel" id="cancelAdd">Отмена</button>
 <button class="btn-save" id="saveAdd">Сохранить</button>
 </div>
 </div>
 </div>

 <div class="toast" id="toast"></div>

<script>
const schedule9 = {
 "Понедельник": ["РОВ", "Английский язык", "География", "История", "Алгебра", "Биология", "Химия"],
 "Вторник": ["Литература", "Биология", "Физика", "ОБЗР", "Геометрия", "Литература", "Общество"],
 "Среда": ["Классный час", "Русский язык", "Английский язык", "Общество", "Физкультура", "Физкультура", "Алгебра", "Вероятность"],
 "Четверг": ["Литература", "Английский язык", "Русский язык", "Биология", "Общество", "История", "Геометрия", "РМГ"],
 "Пятница": ["—", "Общество", "Экология", "Физика", "Алгебра", "История", "Физкультура", "Информатика"]
};

const defaultDays = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница"];

const STORAGE_KEY = 'school-hw-board';
const PASS_KEY = 'teacher-password';

let hwData = {}; // key: "class_day_lessonIndex" -> text
let teacherPassword = null;
let activeClass = '9';

const classFiltersEl = document.getElementById('class-filters');
const scheduleCardsEl = document.getElementById('schedule-cards');
const backdrop = document.getElementById('backdrop');
const toastEl = document.getElementById('toast');

function showToast(msg) {
 toastEl.textContent = msg;
 toastEl.classList.add('show');
 setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function getHWKey(cls, day, idx) {
 return `${cls}_${day}_${idx}`;
}

async function loadAll() {
 try {
 const res = await window.storage.get(STORAGE_KEY, true);
 hwData = res ? JSON.parse(res.value) : {};
 } catch (e) {
 hwData = {};
 }
 try {
 const passRes = await window.storage.get(PASS_KEY, true);
 teacherPassword = passRes ? passRes.value : null;
 } catch (e) {
 teacherPassword = null;
 }
 renderClasses();
 renderSchedule();
}

async function saveAll() {
 await window.storage.set(STORAGE_KEY, JSON.stringify(hwData), true);
}

function renderClasses() {
 let html = '';
 for (let i = 1; i <= 11; i++) {
 html += `<button class="chip ${String(i) === String(activeClass) ? 'active' : ''}" data-class="${i}">${i} Класс</button>`;
 }
 classFiltersEl.innerHTML = html;
}

function getScheduleForClass(cls) {
 if (String(cls) === '9') return schedule9;
 return {
 "Понедельник": ["Предмет 1", "Предмет 2", "Предмет 3", "Предмет 4", "Предмет 5"],
 "Вторник": ["Предмет 1", "Предмет 2", "Предмет 3", "Предмет 4", "Предмет 5"],
 "Среда": ["Предмет 1", "Предмет 2", "Предмет 3", "Предмет 4", "Предмет 5"],
 "Четверг": ["Предмет 1", "Предмет 2", "Предмет 3", "Предмет 4", "Предмет 5"],
 "Пятница": ["Предмет 1", "Предмет 2", "Предмет 3", "Предмет 4", "Предмет 5"]
 };
}

function renderSchedule() {
 const days = getScheduleForClass(activeClass);
 let html = '';

 for (const [day, lessons] of Object.entries(days)) {
 html += `<div class="day-card">
 <div class="day-title">${day}</div>
 <div class="lesson-list">`;

 lessons.forEach((lesson, idx) => {
 const key = getHWKey(activeClass, day, idx);
 const text = hwData[key] || '';

 html += `
 <div class="lesson-item">
 <div class="lesson-header">
 <span class="lesson-num">${idx + 1}.</span>
 <span class="lesson-name">${lesson}</span>
 </div>
 ${text ? `
 <div class="hw-box">
 <div>${text}</div>
 <div class="hw-actions">
 <button class="btn-action btn-share" onclick="shareHW('${activeClass}', '${day}', '${lesson}', '${encodeURIComponent(text)}')">Поделиться в Max</button>
 <button class="btn-action btn-del" onclick="deleteHW('${key}')">Удалить</button>
 </div>
 </div>
 ` : `<div class="hw-empty">Нет задания</div>`}
 </div>`;
 });

 html += `</div></div>`;
 }

 scheduleCardsEl.innerHTML = html;
}

classFiltersEl.addEventListener('click', e => {
 const btn = e.target.closest('.chip');
 if (!btn) return;
 activeClass = btn.dataset.class;
 renderClasses();
 renderSchedule();
});

async function shareHW(cls, day, subject, textEncoded) {
 const text = decodeURIComponent(textEncoded);
 const msg = `📚 ДЗ — ${subject}
Класс: ${cls}
День: ${day}

${text}`;

 if (navigator.share) {
 try {
 await navigator.share({ text: msg });
 } catch (e) {}
 } else {
 try {
 await navigator.clipboard.writeText(msg);
 showToast('Скопировано — вставь в чат Max');
 } catch (e) {
 showToast('Ошибка копирования');
 }
 }
}

async function deleteHW(key) {
 const pass = prompt('Пароль учителя для удаления:');
 if (pass === null) return;
 if (teacherPassword && pass !== teacherPassword) {
 showToast('Неверный пароль');
 return;
 }
 delete hwData[key];
 await saveAll();
 renderSchedule();
 showToast('Задание удалено');
}

function initModalSelects() {
 const classSel = document.getElementById('f-class');
 classSel.innerHTML = '';
 for (let i = 1; i <= 11; i++) {
 const opt = document.createElement('option');
 opt.value = i;
 opt.textContent = `${i} Класс`;
 if (String(i) === String(activeClass)) opt.selected = true;
 classSel.appendChild(opt);
 }

 const daySel = document.getElementById('f-day');
 daySel.innerHTML = '';
 defaultDays.forEach(d => {
 const opt = document.createElement('option');
 opt.value = d;
 opt.textContent = d;
 daySel.appendChild(opt);
 });

 updateSubjectOptions();
}

function updateSubjectOptions() {
 const cls = document.getElementById('f-class').value;
 const day = document.getElementById('f-day').value;
 const subjSel = document.getElementById('f-subject');
 subjSel.innerHTML = '';

 const days = getScheduleForClass(cls);
 const lessons = days[day] || [];

 lessons.forEach((lesson, idx) => {
 const opt = document.createElement('option');
 opt.value = idx;
 opt.textContent = `${idx + 1}. ${lesson}`;
 subjSel.appendChild(opt);
 });
}

document.getElementById('openAdd').addEventListener('click', () => {
 document.getElementById('pass-hint').textContent = teacherPassword
 ? ''
 : 'Пароль ещё не задан — тот, что введёшь сейчас, станет паролем учителя';
 initModalSelects();
 backdrop.classList.add('open');
});

document.getElementById('cancelAdd').addEventListener('click', () => {
 backdrop.classList.remove('open');
});

backdrop.addEventListener('click', e => {
 if (e.target === backdrop) backdrop.classList.remove('open');
});

document.getElementById('saveAdd').addEventListener('click', async () => {
 const pass = document.getElementById('f-pass').value;
 const cls = document.getElementById('f-class').value;
 const day = document.getElementById('f-day').value;
 const lessonIdx = document.getElementById('f-subject').value;
 const text = document.getElementById('f-text').value.trim();

 if (!text) {
 showToast('Введи текст задания');
 return;
 }
 if (!pass) {
 showToast('Введи пароль');
 return;
 }

 if (!teacherPassword) {
 try {
 await window.storage.set(PASS_KEY, pass, true);
 teacherPassword = pass;
 } catch (e) {
 showToast('Ошибка сохранения пароля');
 return;
 }
 } else if (pass !== teacherPassword) {
 showToast('Неверный пароль учителя');
 return;
 }

 const key = getHWKey(cls, day, lessonIdx);
 hwData[key] = text;
 await saveAll();

 document.getElementById('f-pass').value = '';
 document.getElementById('f-text').value = '';
 backdrop.classList.remove('open');
 renderSchedule();
 showToast('Задание добавлено');
});

loadAll();
</script>
</body>
  </html>
